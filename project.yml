name: Flowstate
options:
  bundleIdPrefix: com.keegan            # change to your own reverse-DNS if you prefer
  deploymentTarget:
    macOS: "14.0"                       # 14+ gives us MenuBarExtra + .onKeyPress
targets:
  Flowstate:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: scripts            # bundled into Contents/Resources/scripts (in-app Liked setup)
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keegan.flowstate
        MARKETING_VERSION: "0.2.1"
        GENERATE_INFOPLIST_FILE: true
        # Tells macOS this is a menu-bar accessory (no Dock icon):
        INFOPLIST_KEY_LSUIElement: true
        # Shown in the one-time "Flowstate wants to control Spotify" Automation prompt:
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Flowstate controls the Spotify app to play your focus soundtrack."
        ENABLE_APP_SANDBOX: false       # we shell out to osascript (AppleScript → Spotify)
